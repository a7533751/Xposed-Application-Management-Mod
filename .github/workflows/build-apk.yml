name: Build APK

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Build variant
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release
  push:
    branches:
      - master
      - main
      - '**'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-26" \
            "build-tools;27.0.3"

      - name: Prepare Gradle
        shell: bash
        run: chmod +x ./gradlew

      - name: Prepare release signing key
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.variant == 'release' }}
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
        run: |
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASS ALIAS_NAME ALIAS_PASS; do
            if [ -z "${!name}" ]; then
              echo "::error::$name secret is required for release builds"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          mkdir -p building/keys
          echo "$KEYSTORE_BASE64" | base64 -d > building/keys/keys_android.jks

      - name: Build debug APK
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.variant == 'debug' }}
        shell: bash
        run: ./gradlew --no-daemon --stacktrace :x-apm-app:assembleDebug

      - name: Build release APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.variant == 'release' }}
        shell: bash
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
        run: ./gradlew --no-daemon --stacktrace :x-apm-app:assembleRelease

      - name: Collect APKs
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts
          find . -path '*/build/outputs/apk/*.apk' -type f -print -exec cp -v {} artifacts/ \;
          find . -path '*/build/outputs/apk/*/*.apk' -type f -print -exec cp -v {} artifacts/ \;
          ls -la artifacts || true

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x-apm-apks-${{ github.run_number }}
          path: artifacts/*.apk
          if-no-files-found: warn
